[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blastradius"
dynamic = ["version"]  # from src/blastradius/__init__.py
description = "Predict which services an API change will break, before it ships."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ram Prakash Yallavula" }]
requires-python = ">=3.10"
keywords = ["openapi", "api", "breaking-changes", "static-analysis", "github-action", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The web playground's API: uvicorn blastradius.server:app
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8.0",
    "ruff~=0.17.0",
    "fastapi>=0.110",
    # FastAPI's TestClient: newer Starlette wants httpx2, which needs Python 3.11+.
    "httpx2>=2.16; python_version >= '3.11'",
    "httpx>=0.27; python_version < '3.11'",
]

[project.scripts]
blastradius = "blastradius.cli:app"

[project.urls]
Homepage = "https://github.com/ramprakashyallavula/Blast-Radius-for-API-s"
Source = "https://github.com/ramprakashyallavula/Blast-Radius-for-API-s"
Issues = "https://github.com/ramprakashyallavula/Blast-Radius-for-API-s/issues"
Changelog = "https://github.com/ramprakashyallavula/Blast-Radius-for-API-s/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/blastradius/__init__.py"

[tool.hatch.build.targets.sdist]
# Leading slashes anchor to the project root ("src" alone would also match web/src).
include = [
    "/src",
    "/tests",
    "/examples",
    "/eval",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]

[tool.hatch.build.targets.wheel.force-include]
# The demo the web API serves at GET /demo.
"examples" = "blastradius/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly, so tests never depend on how the package was installed.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"  # flags syntax newer than the oldest supported Python
extend-exclude = ["examples", "eval/cases"]

[tool.ruff.lint]
# Listed explicitly so results don't change when ruff's defaults do.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
