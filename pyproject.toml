[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blastradius"
version = "0.1.0"
description = "Predict which services an API change will break, before it ships."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff~=0.17.0", "fastapi>=0.110"]

[project.scripts]
blastradius = "blastradius.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly, so tests never depend on how the package was installed.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["examples", "eval/cases"]

[tool.ruff.lint]
# Listed explicitly so results don't change when ruff's defaults do.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
